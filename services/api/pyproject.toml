[tool.poetry]
name = "jobmatch-api"
version = "0.1.0"
description = "FastAPI backend for JobMatch AI."
authors = ["JobMatch AI Contributors"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = ">=0.115"
uvicorn = { extras = ["standard"], version = ">=0.32" }
pydantic = ">=2"
pydantic-settings = ">=2"
celery = ">=5"
redis = ">=5"
supabase = ">=2"
PyJWT = ">=2.10"
httpx = ">=0.28"
pdfplumber = ">=0.11"
playwright = ">=1.49"
resend = ">=2.0"
sentry-sdk = ">=2.0"

[tool.poetry.group.dev.dependencies]
mypy = ">=1.14"
pytest = ">=8.3"
pytest-asyncio = ">=0.25"
pytest-cov = ">=6.0"
ruff = ">=0.8"
coverage = ">=7.6"
pytest-randomly = ">=5.0"  # mezcla el orden de los tests en cada corrida (3.7.6)

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    "kombu",
    "kombu.*",
    "playwright",
    "playwright.*",
    "resend",
    "resend.*",
    "sentry_sdk",
    "sentry_sdk.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
# La consigna (3.7.3) permite excluir configuración, migraciones, código generado y el
# punto de entrada. Se excluye solo eso, y queda declarado acá para poder justificarlo.
omit = [
    "app/config.py",            # solo lee variables de entorno
    "app/tasks/celery_app.py",  # arranque del worker, no se ejecuta en los tests
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: prueba contra el proyecto de Supabase de pruebas (Decisión 4)",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
