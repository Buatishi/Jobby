<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1616px;height:1154px;background:#FFFFFF;" width="1616px" height="1154px" viewBox="0 0 1616 1154" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="15"><text x="584.058" y="33.132" fill="#000" font-size="14" textLength="446.564" font-weight="700" font-family="Arial">Recorrido del código hasta producción y estado real de cada etapa</text></g><rect x="20" y="53.777" width="1569.68" height="17.249" fill="none" style="stroke:none;"/><rect x="20" y="53.777" width="321.948" height="992.813" fill="#E6F2EE" style="stroke:#E6F2EE;stroke-width:1;"/><ellipse cx="181.974" cy="86.026" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="26" y="116.026" width="311.948" height="64.846" fill="#D5EBE3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="138.22" fill="#000" font-size="13" textLength="146.65" font-weight="700" font-family="Arial">1 · Cambio en una rama</text><text x="36" y="153.168" fill="#000" font-size="13" textLength="265.891" font-family="Arial">Trabaja en una rama corta (feat/, fix/, docs/…)</text><text x="36" y="168.117" fill="#000" font-size="13" textLength="291.948" font-family="Arial">y ejecuta typecheck, lint, tests y build en su equipo</text><rect x="89.975" y="200.872" width="183.998" height="49.897" fill="#D5EBE3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="99.975" y="223.066" fill="#000" font-size="13" textLength="163.998" font-weight="700" font-family="Arial">2 · Pull request hacia main</text><text x="99.975" y="238.015" fill="#000" font-size="13" textLength="118.523" font-family="Arial">Evento: pull_request</text><line x1="20" y1="53.777" x2="20" y2="1046.59" style="stroke:#000;stroke-width:1.5;"/><rect x="341.948" y="53.777" width="652.527" height="992.813" fill="#EAF0F8" style="stroke:#EAF0F8;stroke-width:1;"/><rect x="508.348" y="270.77" width="332.92" height="79.795" fill="#D6E2F3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="518.348" y="292.963" fill="#000" font-size="13" textLength="262.266" font-family="Arial">Se dispara «CI»: instalar, verificar y construir.</text><text x="518.348" y="307.912" fill="#000" font-size="13" textLength="312.92" font-family="Arial">Corre desde el 2026-09-22; antes la cuenta de GitHub</text><text x="518.348" y="322.861" fill="#000" font-size="13" textLength="252.967" font-family="Arial">estaba bloqueada por facturación y ninguna</text><text x="518.348" y="337.81" fill="#000" font-size="13" textLength="198.739" font-family="Arial">ejecución llegaba a correr un paso</text><rect x="486.297" y="370.564" width="377.024" height="79.795" fill="#D6E2F3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="496.297" y="392.758" fill="#000" font-size="13" textLength="138.703" font-weight="700" font-family="Arial">3 · Protección de main</text><text x="638.611" y="392.758" fill="#000" font-size="13" textLength="64.295" font-family="Arial">(verificada)</text><text x="496.297" y="407.707" fill="#000" font-size="13" textLength="315.06" font-family="Arial">Pull request obligatorio, también para administradores,</text><text x="496.297" y="422.656" fill="#000" font-size="13" textLength="290.469" font-family="Arial">sin force-push ni borrado, y los tres trabajos del CI</text><text x="496.297" y="437.604" fill="#000" font-size="13" textLength="357.024" font-family="Arial">en verde. Con un error deliberado, el merge queda bloqueado</text><rect x="605.55" y="470.359" width="138.517" height="49.897" fill="#D6E2F3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="615.55" y="492.553" fill="#000" font-size="13" textLength="101.867" font-weight="700" font-family="Arial">4 · Merge a main</text><text x="615.55" y="507.502" fill="#000" font-size="13" textLength="118.517" font-family="Arial">Evento: push a main</text><rect x="504.768" y="540.257" width="340.081" height="79.795" fill="#D6E2F3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="514.768" y="562.451" fill="#000" font-size="13" textLength="106.933" font-weight="700" font-family="Arial">5a · Pipeline «CI»</text><text x="625.313" y="562.451" fill="#000" font-size="13" textLength="209.536" font-family="Arial">(ci.yml). Evento: push y pull_request</text><text x="514.768" y="577.399" fill="#000" font-size="13" textLength="192.194" font-family="Arial">Web: typecheck, lint, tests y build</text><text x="514.768" y="592.348" fill="#000" font-size="13" textLength="299.851" font-family="Arial">API: mypy, ruff, tests y cobertura con corte del 65 %</text><text x="514.768" y="607.297" fill="#000" font-size="13" textLength="140.899" font-family="Arial">Tipos compartidos: build</text><polygon points="601.106,640.052,748.511,640.052,760.511,652.052,748.511,664.052,601.106,664.052,589.106,652.052,601.106,640.052" fill="#F1F1F1" style="stroke:#4A5568;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="601.106" y="656.771" fill="#000" font-size="13" textLength="147.405" font-family="Arial">¿Pasan los tres trabajos?</text><text x="578.994" y="649.297" fill="#000" font-size="13" textLength="10.112" font-family="Arial">sí</text><text x="760.511" y="649.297" fill="#000" font-size="13" textLength="14.46" font-family="Arial">no</text><rect x="347.948" y="684.052" width="233.903" height="64.846" fill="#D6E2F3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="357.948" y="706.246" fill="#000" font-size="13" textLength="96.078" font-weight="700" font-family="Arial">5d · Despliegue</text><text x="457.638" y="706.246" fill="#000" font-size="13" textLength="83.764" font-family="Arial">(mismo ci.yml)</text><text x="357.948" y="721.194" fill="#000" font-size="13" textLength="213.903" font-family="Arial">Depende (needs) de los tres trabajos</text><text x="357.948" y="736.143" fill="#000" font-size="13" textLength="177.042" font-family="Arial">y llama a los dos deploy hooks</text><rect x="778.96" y="684.052" width="211.515" height="49.897" fill="#D6E2F3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="788.96" y="706.246" fill="#000" font-size="13" textLength="129.359" font-family="Arial">El despliegue no corre</text><text x="788.96" y="721.194" fill="#000" font-size="13" textLength="191.515" font-family="Arial">y producción queda como estaba</text><polygon points="674.808,980.59,686.808,992.59,674.808,1004.59,662.808,992.59,674.808,980.59" fill="#F1F1F1" style="stroke:#4A5568;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="674.808" cy="1035.59" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="674.808" cy="1035.59" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="341.948" y1="53.777" x2="341.948" y2="1046.59" style="stroke:#000;stroke-width:1.5;"/><rect x="994.475" y="53.777" width="594.121" height="992.813" fill="#FFF4D6" style="stroke:#FFF4D6;stroke-width:1;"/><rect x="1000.475" y="768.898" width="584.121" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="1012.475" y="794.898" width="278.711" height="79.795" fill="#FFE9AE" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1022.475" y="817.092" fill="#000" font-size="13" textLength="71.513" font-weight="700" font-family="Arial">5b · Render</text><text x="1093.988" y="817.092" fill="#000" font-size="13" textLength="125.03" font-family="Arial">. Evento: deploy hook</text><text x="1022.475" y="832.041" fill="#000" font-size="13" textLength="217.49" font-family="Arial">Construye la imagen Docker de main,</text><text x="1022.475" y="846.989" fill="#000" font-size="13" textLength="258.711" font-family="Arial">despliega jobmatch-api y comprueba /health.</text><text x="1022.475" y="861.938" fill="#000" font-size="13" textLength="186.469" font-family="Arial">Despliegue automático apagado</text><rect x="1319.187" y="794.898" width="253.41" height="79.795" fill="#FFE9AE" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1329.187" y="817.092" fill="#000" font-size="13" textLength="65.044" font-weight="700" font-family="Arial">5c · Vercel</text><text x="1394.231" y="817.092" fill="#000" font-size="13" textLength="125.03" font-family="Arial">. Evento: deploy hook</text><text x="1329.187" y="832.041" fill="#000" font-size="13" textLength="217.49" font-family="Arial">Construye main como producción y lo</text><text x="1329.187" y="846.989" fill="#000" font-size="13" textLength="185.009" font-family="Arial">publica en jobbyweb.vercel.app.</text><text x="1329.187" y="861.938" fill="#000" font-size="13" textLength="233.41" font-family="Arial">vercel.json apaga los builds automáticos</text><rect x="1000.475" y="894.693" width="584.121" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="1132.972" y="920.693" width="319.127" height="49.897" fill="#FFE9AE" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1142.972" y="942.887" fill="#000" font-size="13" textLength="90.289" font-weight="700" font-family="Arial">6 · Producción</text><text x="1142.972" y="957.835" fill="#000" font-size="13" textLength="299.127" font-family="Arial">Web en Vercel y API en Render, ambas por HTTPS</text><line x1="994.475" y1="53.777" x2="994.475" y2="1046.59" style="stroke:#000;stroke-width:1.5;"/><line x1="1588.596" y1="53.777" x2="1588.596" y2="1046.59" style="stroke:#000;stroke-width:1.5;"/><line x1="181.974" y1="96.026" x2="181.974" y2="116.026" style="stroke:#4A5568;stroke-width:1;"/><polygon points="177.974,106.026,181.974,116.026,185.974,106.026,181.974,110.026" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimi