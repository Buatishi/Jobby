<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1477px;height:1162px;background:#FFFFFF;" width="1477px" height="1162px" viewBox="0 0 1477 1162" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="15"><text x="514.544" y="33.132" fill="#000" font-size="14" textLength="446.564" font-weight="700" font-family="Arial">Recorrido del código hasta producción y estado real de cada etapa</text></g><rect x="20" y="53.777" width="1430.653" height="17.249" fill="none" style="stroke:none;"/><rect x="20" y="53.777" width="321.948" height="984.762" fill="#E6F2EE" style="stroke:#E6F2EE;stroke-width:1;"/><ellipse cx="181.974" cy="86.026" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="26" y="116.026" width="311.948" height="64.846" fill="#D5EBE3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="138.22" fill="#000" font-size="13" textLength="146.65" font-weight="700" font-family="Arial">1 · Cambio en una rama</text><text x="36" y="153.168" fill="#000" font-size="13" textLength="265.891" font-family="Arial">Trabaja en una rama corta (feat/, fix/, docs/…)</text><text x="36" y="168.117" fill="#000" font-size="13" textLength="291.948" font-family="Arial">y ejecuta typecheck, lint, tests y build en su equipo</text><rect x="89.975" y="200.872" width="183.998" height="49.897" fill="#D5EBE3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="99.975" y="223.066" fill="#000" font-size="13" textLength="163.998" font-weight="700" font-family="Arial">2 · Pull request hacia main</text><text x="99.975" y="238.015" fill="#000" font-size="13" textLength="118.523" font-family="Arial">Evento: pull_request</text><line x1="20" y1="53.777" x2="20" y2="1038.539" style="stroke:#000;stroke-width:1.5;"/><rect x="341.948" y="53.777" width="557.794" height="984.762" fill="#EAF0F8" style="stroke:#EAF0F8;stroke-width:1;"/><rect x="551.97" y="270.77" width="328.483" height="49.897" fill="#D6E2F3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="561.97" y="292.963" fill="#000" font-size="13" textLength="218.95" font-family="Arial">Se disparan «CI» y «Deploy Preview»</text><text x="561.97" y="307.912" fill="#000" font-size="13" textLength="308.483" font-family="Arial">(instalar, verificar y construir, y vista previa en Vercel)</text><rect x="553.002" y="340.667" width="326.42" height="79.795" fill="#FDECEC" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="563.002" y="362.861" fill="#000" font-size="13" textLength="216.068" font-family="Arial">Estado real: los trabajos no arrancan.</text><text x="563.002" y="377.81" fill="#000" font-size="13" textLength="248.6" font-family="Arial">GitHub responde «account is locked due to</text><text x="563.002" y="392.758" fill="#000" font-size="13" textLength="247.146" font-family="Arial">a billing issue». Ninguna de las 83 corridas</text><text x="563.002" y="407.707" fill="#000" font-size="13" textLength="306.42" font-family="Arial">propias ejecutó un paso (hay 1 más, de Dependabot)</text><rect x="548.682" y="440.462" width="335.06" height="64.846" fill="#D6E2F3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="558.682" y="462.656" fill="#000" font-size="13" textLength="138.703" font-weight="700" font-family="Arial">3 · Protección de main</text><text x="700.997" y="462.656" fill="#000" font-size="13" textLength="64.295" font-family="Arial">(verificada)</text><text x="558.682" y="477.604" fill="#000" font-size="13" textLength="315.06" font-family="Arial">Pull request obligatorio, también para administradores,</text><text x="558.682" y="492.553" fill="#000" font-size="13" textLength="281.087" font-family="Arial">sin force-push ni borrado. No exige checks de CI</text><rect x="646.953" y="525.308" width="138.517" height="49.897" fill="#D6E2F3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="656.953" y="547.502" fill="#000" font-size="13" textLength="101.867" font-weight="700" font-family="Arial">4 · Merge a main</text><text x="656.953" y="562.451" fill="#000" font-size="13" textLength="118.517" font-family="Arial">Evento: push a main</text><rect x="347.948" y="595.206" width="547.794" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="359.948" y="678.603" width="340.081" height="79.795" fill="#FDECEC" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="369.948" y="700.797" fill="#000" font-size="13" textLength="106.933" font-weight="700" font-family="Arial">5a · Pipeline «CI»</text><text x="480.492" y="700.797" fill="#000" font-size="13" textLength="209.536" font-family="Arial">(ci.yml). Evento: push y pull_request</text><text x="369.948" y="715.746" fill="#000" font-size="13" textLength="270.213" font-family="Arial">Web: typecheck, lint, build · API: mypy y pytest</text><text x="369.948" y="730.694" fill="#000" font-size="13" textLength="140.899" font-family="Arial">Tipos compartidos: build</text><text x="369.948" y="745.643" fill="#000" font-size="13" textLength="243.547" font-family="Arial">No mide cobertura ni bloquea despliegues</text><rect x="579.767" y="931.693" width="272.891" height="64.846" fill="#FDECEC" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="589.767" y="953.887" fill="#000" font-size="13" textLength="247.152" font-family="Arial">Falta el «gate» de despliegue (Decisión 6):</text><text x="589.767" y="968.835" fill="#000" font-size="13" textLength="251.539" font-family="Arial">un paso de despliegue que dependa del CI,</text><text x="589.767" y="983.784" fill="#000" font-size="13" textLength="252.891" font-family="Arial">con cobertura mínima del 65 % (Decisión 3)</text><ellipse cx="716.212" cy="1027.539" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="716.212" cy="1027.539" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="341.948" y1="53.777" x2="341.948" y2="1038.539" style="stroke:#000;stroke-width:1.5;"/><rect x="899.742" y="53.777" width="549.828" height="984.762" fill="#FFF4D6" style="stroke:#FFF4D6;stroke-width:1;"/><rect x="1089.122" y="621.206" width="344.448" height="79.795" fill="#FFE9AE" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1099.122" y="643.399" fill="#000" font-size="13" textLength="71.513" font-weight="700" font-family="Arial">5b · Render</text><text x="1170.634" y="643.399" fill="#000" font-size="13" textLength="221.832" font-family="Arial">. Evento: push a main (integración Git)</text><text x="1099.122" y="658.348" fill="#000" font-size="13" textLength="213.878" font-family="Arial">Construye la imagen Docker de main</text><text x="1099.122" y="673.297" fill="#000" font-size="13" textLength="324.448" font-family="Arial">y despliega jobmatch-api (y el servicio heredado Jobby),</text><text x="1099.122" y="688.246" fill="#000" font-size="13" textLength="205.226" font-family="Arial">comprueba /health. No espera al CI</text><rect x="1107.907" y="736" width="306.876" height="79.795" fill="#FFE9AE" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1117.907" y="758.194" fill="#000" font-size="13" textLength="65.044" font-weight="700" font-family="Arial">5c · Vercel</text><text x="1182.952" y="758.194" fill="#000" font-size="13" textLength="221.832" font-family="Arial">. Evento: push a main (integración Git)</text><text x="1117.907" y="773.143" fill="#000" font-size="13" textLength="199.412" font-family="Arial">Construye main como vista previa.</text><text x="1117.907" y="788.092" fill="#000" font-size="13" textLength="231.239" font-family="Arial">El dominio público se promueve a mano</text><text x="1117.907" y="803.041" fill="#000" font-size="13" textLength="231.245" font-family="Arial">(alias jobbyweb.vercel.app, 2026-09-21)</text><rect x="905.742" y="835.795" width="539.828" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="917.742" y="861.795" width="319.127" height="49.897" fill="#FFE9AE" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="927.742" y="883.989" fill="#000" font-size="13" textLength="90.289" font-weight="700" font-family="Arial">6 · Producción</text><text x="927.742" y="898.938" fill="#000" font-size="13" textLength="299.127" font-family="Arial">Web en Vercel y API en Render, ambas por HTTPS</text><line x1="899.742" y1="53.777" x2="899.742" y2="1038.539" style="stroke:#000;stroke-width:1.5;"/><line x1="1449.569" y1="53.777" x2="1449.569" y2="1038.539" style="stroke:#000;stroke-width:1.5;"/><line x1="181.974" y1="96.026" x2="181.974" y2="116.026" style="stroke:#4A5568;stroke-width:1;"/><polygon points="177.974,106.026,181.974,116.026,185.974,106.026,181.974,110.026" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="181.974" y1="180.872" x2="181.974" y2="200.872" style="stroke:#4A5568;stroke-width:1;"/><polygon points="177.974,190.872,181.974,200.872,185.974,190.872,181.974,194.872" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="716.212" y1="320.667" x2="716.212" y2="340.667" style="stroke:#4A5568;stroke-width:1;"/><polygon points="712.212,330.667,716.212,340.667,720.212,330.667,716.212,334.667" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="716.212" y1="420.462" x2="716.212" y2="440.462" style="stroke:#4A5568;stroke-width:1;"/><polygon points="712.212,430.462,716.212,440.462,720.212,430.462,716.212,434.462" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="716.212" y1="505.308" x2="716.212" y2="525.308" style="stroke:#4A5568;strok