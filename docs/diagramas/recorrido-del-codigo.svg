<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1539px;height:1107px;background:#FFFFFF;" width="1539px" height="1107px" viewBox="0 0 1539 1107" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="15"><text x="545.415" y="33.132" fill="#000" font-size="14" textLength="446.564" font-weight="700" font-family="Arial">Recorrido del código hasta producción y estado real de cada etapa</text></g><rect x="20" y="53.777" width="1492.394" height="17.249" fill="none" style="stroke:none;"/><rect x="20" y="53.777" width="321.948" height="929.762" fill="#E6F2EE" style="stroke:#E6F2EE;stroke-width:1;"/><ellipse cx="181.974" cy="86.026" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="26" y="116.026" width="311.948" height="64.846" fill="#D5EBE3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="138.22" fill="#000" font-size="13" textLength="146.65" font-weight="700" font-family="Arial">1 · Cambio en una rama</text><text x="36" y="153.168" fill="#000" font-size="13" textLength="265.891" font-family="Arial">Trabaja en una rama corta (feat/, fix/, docs/…)</text><text x="36" y="168.117" fill="#000" font-size="13" textLength="291.948" font-family="Arial">y ejecuta typecheck, lint, tests y build en su equipo</text><rect x="89.975" y="200.872" width="183.998" height="49.897" fill="#D5EBE3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="99.975" y="223.066" fill="#000" font-size="13" textLength="163.998" font-weight="700" font-family="Arial">2 · Pull request hacia main</text><text x="99.975" y="238.015" fill="#000" font-size="13" textLength="118.523" font-family="Arial">Evento: pull_request</text><line x1="20" y1="53.777" x2="20" y2="983.539" style="stroke:#000;stroke-width:1.5;"/><rect x="341.948" y="53.777" width="619.534" height="929.762" fill="#EAF0F8" style="stroke:#EAF0F8;stroke-width:1;"/><rect x="549.752" y="270.77" width="332.92" height="79.795" fill="#D6E2F3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="559.752" y="292.963" fill="#000" font-size="13" textLength="262.266" font-family="Arial">Se dispara «CI»: instalar, verificar y construir.</text><text x="559.752" y="307.912" fill="#000" font-size="13" textLength="312.92" font-family="Arial">Corre desde el 2026-09-22; antes la cuenta de GitHub</text><text x="559.752" y="322.861" fill="#000" font-size="13" textLength="252.967" font-family="Arial">estaba bloqueada por facturación y ninguna</text><text x="559.752" y="337.81" fill="#000" font-size="13" textLength="198.739" font-family="Arial">ejecución llegaba a correr un paso</text><rect x="527.7" y="370.564" width="377.024" height="79.795" fill="#D6E2F3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="537.7" y="392.758" fill="#000" font-size="13" textLength="138.703" font-weight="700" font-family="Arial">3 · Protección de main</text><text x="680.014" y="392.758" fill="#000" font-size="13" textLength="64.295" font-family="Arial">(verificada)</text><text x="537.7" y="407.707" fill="#000" font-size="13" textLength="315.06" font-family="Arial">Pull request obligatorio, también para administradores,</text><text x="537.7" y="422.656" fill="#000" font-size="13" textLength="290.469" font-family="Arial">sin force-push ni borrado, y los tres trabajos del CI</text><text x="537.7" y="437.604" fill="#000" font-size="13" textLength="357.024" font-family="Arial">en verde. Con un error deliberado, el merge queda bloqueado</text><rect x="646.953" y="470.359" width="138.517" height="49.897" fill="#D6E2F3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="656.953" y="492.553" fill="#000" font-size="13" textLength="101.867" font-weight="700" font-family="Arial">4 · Merge a main</text><text x="656.953" y="507.502" fill="#000" font-size="13" textLength="118.517" font-family="Arial">Evento: push a main</text><rect x="347.948" y="540.257" width="609.534" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="359.948" y="566.257" width="340.081" height="79.795" fill="#D6E2F3" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="369.948" y="588.451" fill="#000" font-size="13" textLength="106.933" font-weight="700" font-family="Arial">5a · Pipeline «CI»</text><text x="480.492" y="588.451" fill="#000" font-size="13" textLength="209.536" font-family="Arial">(ci.yml). Evento: push y pull_request</text><text x="369.948" y="603.399" fill="#000" font-size="13" textLength="192.194" font-family="Arial">Web: typecheck, lint, tests y build</text><text x="369.948" y="618.348" fill="#000" font-size="13" textLength="299.851" font-family="Arial">API: mypy, ruff, tests y cobertura con corte del 65 %</text><text x="369.948" y="633.297" fill="#000" font-size="13" textLength="140.899" font-family="Arial">Tipos compartidos: build</text><rect x="365.391" y="666.052" width="329.194" height="79.795" fill="#FDECEC" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="375.391" y="688.246" fill="#000" font-size="13" textLength="96.078" font-weight="700" font-family="Arial">5d · Despliegue</text><text x="475.081" y="688.246" fill="#000" font-size="13" textLength="209.504" font-family="Arial">(mismo ci.yml). Evento: push a main</text><text x="375.391" y="703.194" fill="#000" font-size="13" textLength="304.237" font-family="Arial">Depende (needs) de los tres trabajos: si alguno falla,</text><text x="375.391" y="718.143" fill="#000" font-size="13" textLength="231.969" font-family="Arial">no corre y producción queda como está.</text><text x="375.391" y="733.092" fill="#000" font-size="13" textLength="291.218" font-family="Arial">Pendiente: cargar los deploy hooks como secretos</text><rect x="486.942" y="861.744" width="458.541" height="79.795" fill="#FDECEC" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="496.942" y="883.938" fill="#000" font-size="13" textLength="201.557" font-family="Arial">Falta cerrar el circuito (Decisión 6):</text><text x="496.942" y="898.887" fill="#000" font-size="13" textLength="438.541" font-family="Arial">cargar RENDER_DEPLOY_HOOK_URL y VERCEL_DEPLOY_HOOK_URL</text><text x="496.942" y="913.835" fill="#000" font-size="13" textLength="311.467" font-family="Arial">y apagar el despliegue automático de las plataformas,</text><text x="496.942" y="928.784" fill="#000" font-size="13" textLength="311.486" font-family="Arial">para que el único camino a producción sea el paso 5d</text><ellipse cx="716.212" cy="972.539" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="716.212" cy="972.539" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="341.948" y1="53.777" x2="341.948" y2="983.539" style="stroke:#000;stroke-width:1.5;"/><rect x="961.482" y="53.777" width="549.828" height="929.762" fill="#FFF4D6" style="stroke:#FFF4D6;stroke-width:1;"/><rect x="1150.862" y="566.257" width="344.448" height="79.795" fill="#FFE9AE" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1160.862" y="588.451" fill="#000" font-size="13" textLength="71.513" font-weight="700" font-family="Arial">5b · Render</text><text x="1232.375" y="588.451" fill="#000" font-size="13" textLength="221.832" font-family="Arial">. Evento: push a main (integración Git)</text><text x="1160.862" y="603.399" fill="#000" font-size="13" textLength="213.878" font-family="Arial">Construye la imagen Docker de main</text><text x="1160.862" y="618.348" fill="#000" font-size="13" textLength="324.448" font-family="Arial">y despliega jobmatch-api (y el servicio heredado Jobby),</text><text x="1160.862" y="633.297" fill="#000" font-size="13" textLength="205.226" font-family="Arial">comprueba /health. No espera al CI</text><rect x="1169.648" y="666.052" width="306.876" height="79.795" fill="#FFE9AE" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="1179.648" y="688.246" fill="#000" font-size="13" textLength="65.044" font-weight="700" font-family="Arial">5c · Vercel</text><text x="1244.692" y="688.246" fill="#000" font-size="13" textLength="221.832" font-family="Arial">. Evento: push a main (integración Git)</text><text x="1179.648" y="703.194" fill="#000" font-size="13" textLength="199.412" font-family="Arial">Construye main como vista previa.</text><text x="1179.648" y="718.143" fill="#000" font-size="13" textLength="231.239" font-family="Arial">El dominio público se promueve a mano</text><text x="1179.648" y="733.092" fill="#000" font-size="13" textLength="231.245" font-family="Arial">(alias jobbyweb.vercel.app, 2026-09-21)</text><rect x="967.482" y="765.847" width="539.828" height="6" fill="#555" style="stroke:#555;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="979.482" y="791.847" width="319.127" height="49.897" fill="#FFE9AE" style="stroke:#4A5568;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="989.482" y="814.041" fill="#000" font-size="13" textLength="90.289" font-weight="700" font-family="Arial">6 · Producción</text><text x="989.482" y="828.989" fill="#000" font-size="13" textLength="299.127" font-family="Arial">Web en Vercel y API en Render, ambas por HTTPS</text><line x1="961.482" y1="53.777" x2="961.482" y2="983.539" style="stroke:#000;stroke-width:1.5;"/><line x1="1511.31" y1="53.777" x2="1511.31" y2="983.539" style="stroke:#000;stroke-width:1.5;"/><line x1="181.974" y1="96.026" x2="181.974" y2="116.026" style="stroke:#4A5568;stroke-width:1;"/><polygon points="177.974,106.026,181.974,116.026,185.974,106.026,181.974,110.026" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="181.974" y1="180.872" x2="181.974" y2="200.872" style="stroke:#4A5568;stroke-width:1;"/><polygon points="177.974,190.872,181.974,200.872,185.974,190.872,181.974,194.872" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="716.212" y1="350.564" x2="716.212" y2="370.564" style="stroke:#4A5568;stroke-width:1;"/><polygon points="712.212,360.564,716.212,370.564,720.212,360.564,716.212,364.564" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="716.212" y1="450.359" x2="716.212" y2="470.359" style="stroke:#4A5568;stroke-width:1;"/><polygon points="712.212,460.359,716.212,470.359,720.212,460.359,716.212,464.359" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="529.988" y1="646.052" x2="529.988" y2="666.052" style="stroke:#4A5568;stroke-width:1;"/><polygon points="525.988,656.052,529.988,666.052,533.988,656.052,529.988,660.052" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="529.988" y1="546.257" x2="529.988" y2="566.257" style="stroke:#4A5568;stroke-width:1;"/><polygon points="525.988,556.257,529.988,566.257,533.988,556.257,529.988,560.257" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="716.212" y1="520.257" x2="716.212" y2="540.257" style="stroke:#4A5568;stroke-width:1;"/><polygon points="712.212,530.257,716.212,540.257,720.212,530.257,716.212,534.257" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="716.212" y1="941.539" x2="716.212" y2="961.539" style="stroke:#4A5568;stroke-width:1;"/><polygon points="712.212,951.539,716.212,961.539,720.212,951.539,716.212,955.539" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1323.086" y1="646.052" x2="1323.086" y2="666.052" style="stroke:#4A5568;stroke-width:1;"/><polygon points="1319.086,656.052,1323.086,666.052,1327.086,656.052,1323.086,660.052" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1323.086" y1="745.847" x2="1323.086" y2="765.847" style="stroke:#4A5568;stroke-width:1;"/><polygon points="1319.086,755.847,1323.086,765.847,1327.086,755.847,1323.086,759.847" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1139.046" y1="771.847" x2="1139.046" y2="791.847" style="stroke:#4A5568;stroke-width:1;"/><polygon points="1135.046,781.847,1139.046,791.847,1143.046,781.847,1139.046,785.847" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="181.974" y1="250.77" x2="181.974" y2="255.77" style="stroke:#4A5568;stroke-width:1;"/><line x1="181.974" y1="255.77" x2="716.212" y2="255.77" style="stroke:#4A5568;stroke-width:1;"/><line x1="716.212" y1="255.77" x2="716.212" y2="270.77" style="stroke:#4A5568;stroke-width:1;"/><polygon points="712.212,260.77,716.212,270.77,720.212,260.77,716.212,264.77" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="900.252" y1="546.257" x2="900.252" y2="550.257" style="stroke:#4A5568;stroke-width:1;"/><line x1="900.252" y1="550.257" x2="1323.086" y2="550.257" style="stroke:#4A5568;stroke-width:1;"/><line x1="1323.086" y1="550.257" x2="1323.086" y2="566.257" style="stroke:#4A5568;stroke-width:1;"/><polygon points="1319.086,556.257,1323.086,566.257,1327.086,556.257,1323.086,560.257" fill="#4A5568" style="stroke:#4A5568;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="529.988" y1="745.847" x2="529.988" y2="751.847" style="stroke:#4A5568;stroke-width:1;"/><line x1="529.988" y1="751.847" x2="974.482" y2="751.847" style="stroke:#4A5568;stroke-width:1;"/><line x1="974.482" y1="751.847" x2="974.482" y2="765.847" style="stroke:#4A5568;stroke-width:1;"/><polygon points="970.482,755.847,974.482,765.847,978.482,755.847,974.482,759.847" fill="#4A5568" style="stroke:#