name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_PRICE_MONTHLY: ${{ secrets.NEXT_PUBLIC_PRICE_MONTHLY }}
          NEXT_PUBLIC_PRICE_YEARLY: ${{ secrets.NEXT_PUBLIC_PRICE_YEARLY }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.4.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install

      - name: Typecheck
        run: poetry run mypy app/

      - name: Lint
        run: poetry run ruff check app/ tests/

      - name: Test and coverage
        # Decisión 3: el 65 % es eliminatorio y aplica solo al backend.
        run: poetry run pytest --cov=app --cov-fail-under=65

  shared-types:
    name: Shared Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared-types
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy
    # Decisión 6: el despliegue depende de que los tres trabajos terminen en verde.
    # Si alguno falla, este trabajo no corre y producción se queda como está.
    needs: [frontend, backend, shared-types]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Los secretos no se pueden consultar en el "if" de un paso: se pasan por env.
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Deploy API (Render)
        if: env.RENDER_HOOK != ''
        run: curl -fsS -X POST "$RENDER_HOOK" > /dev/null

      - name: Deploy web (Vercel)
        if: env.VERCEL_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_HOOK" > /dev/null

      - name: Aviso si faltan los deploy hooks
        if: env.RENDER_HOOK == '' && env.VERCEL_HOOK == ''
        run: |
          echo "No hay deploy hooks configurados: el despliegue sigue a cargo de la"
          echo "integración con Git de Render y Vercel, que no espera a este pipeline."
          echo "Para cerrar el corte: cargar RENDER_DEPLOY_HOOK_URL y VERCEL_DEPLOY_HOOK_URL"
          echo "como secretos del repositorio y apagar el despliegue automático."
