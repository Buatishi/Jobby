name: Security

# Revisión de seguridad separada del CI que despliega: no toca los hooks de Render ni de
# Vercel. Corre en cada PR hacia main, en cada push a main y una vez por semana, para
# enterarse de avisos nuevos aunque nadie cambie código.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El historial completo: un secreto borrado después sigue en commits viejos.
          fetch-depth: 0
      - name: Scan the history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --log-opts="--all"

  static-analysis:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: pip install "semgrep==1.179.0"
      - name: Scan the API and the web code
        run: |
          semgrep scan --error --metrics=off --quiet \
            --config p/python --config p/typescript --config p/react \
            --config p/owasp-top-ten --config p/jwt --config p/secrets \
            --exclude node_modules --exclude .next --exclude tests \
            --exclude "*.test.*" \
            services/api/app apps/web/src apps/web/components apps/web/lib \
            apps/web/next.config.ts

  dependencies:
    name: Dependencies (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for known vulnerabilities in the lock files
        # Solo altas y críticas que ya tienen versión corregida. Lo que no tiene arreglo
        # (hoy, braces en las herramientas de compilación) no frena el trabajo.
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/aquasecurity/trivy:0.75.0 \
            fs /repo --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs node_modules,.next,.git,.venv,output --exit-code 1
