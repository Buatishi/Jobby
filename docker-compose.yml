# Servicios locales de apoyo. Solo Redis: la base de datos, el login y los archivos viven en
# Supabase (también en desarrollo), así que no hace falta un Postgres local.
services:
  redis:
    image: redis:7
    container_name: jobmatch-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
